# ============================================================
#  HireBridge AI – Application Configuration
# ============================================================

spring.application.name=hirebridge-backend

# ----- Server -----
server.port=8080

# ----- DataSource -----
# DB_PASSWORD is REQUIRED. The application will not start without it.
# Set via PowerShell  : $env:DB_PASSWORD="your_actual_password"
# Set via cmd.exe     : set DB_PASSWORD=your_actual_password
# Set via Linux/macOS : export DB_PASSWORD="your_actual_password"
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hirebridge_db}
spring.datasource.username=${DB_USERNAME:hirebridge_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool – fail fast if DB is unreachable
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT: Explicitly set the PostgreSQL dialect.
# Without this, Hibernate 6 tries to auto-detect the dialect from a live JDBC
# connection. If the connection fails (e.g. wrong DB_PASSWORD), Hibernate
# produces a misleading secondary error:
#   "Unable to determine Dialect without JDBC metadata"
# This hides the real cause (PostgreSQL authentication failure).
# Setting the dialect explicitly eliminates that secondary error so only
# the real "password authentication failed" message appears.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Suppress the "spring.jpa.open-in-view is enabled" warning
spring.jpa.open-in-view=false

# ----- Admin Seed (AdminInitializer) --------------------------------
#
# On the FIRST startup with no ADMIN row in the database, AdminInitializer
# creates the initial admin account.  Supply credentials via ANY ONE of:
#
#  Option A – OS environment variables (recommended):
#    PowerShell : $env:ADMIN_EMAIL="admin@hirebridge.ai"
#                 $env:ADMIN_PASSWORD="ChangeMe@2026!"
#    Cmd.exe    : set ADMIN_EMAIL=admin@hirebridge.ai
#                 set ADMIN_PASSWORD=ChangeMe@2026!
#    Linux/macOS: export ADMIN_EMAIL="admin@hirebridge.ai"
#                 export ADMIN_PASSWORD="ChangeMe@2026!"
#
#  Option B – JVM system properties (useful for CI/CD):
#    .\mvnw.cmd spring-boot:run ^
#      -Dspring-boot.run.jvmArguments="-DADMIN_EMAIL=admin@hirebridge.ai -DADMIN_PASSWORD=ChangeMe@2026!"
#
#  Option C – application.properties (development convenience only):
#    Uncomment the two lines below and fill in the values.
#    NEVER commit real credentials to source control.
#
# app.admin.email=admin@hirebridge.ai
# app.admin.password=ChangeMe@2026!
#
# After the admin row is created, credentials are no longer needed.
# --------------------------------------------------------------------

# ----- JWT -----
# JWT_SECRET must be at least 32 bytes of random data.
# Generate one:  openssl rand -base64 64
# Set via env:   $env:JWT_SECRET="<value>"
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity in milliseconds (default: 24 hours = 86400000)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
